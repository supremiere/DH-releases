name: Publish requested DungeonHelper release

on:
  push:
    branches: [main]
    paths:
      - "release-request.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Read release request
        id: request
        shell: pwsh
        run: |
          $request = Get-Content "release-request.json" -Raw | ConvertFrom-Json
          $version = [string]$request.version
          $sourceCommit = [string]$request.source_commit
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw "Invalid source commit: $sourceCommit" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT

      - name: Checkout exact source commit
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/supremiere/Dungeonhelper.git source
          git -C source fetch origin ${{ steps.request.outputs.source_commit }} --depth=1
          git -C source checkout --detach ${{ steps.request.outputs.source_commit }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: source/pyproject.toml

      - name: Verify requested version
        shell: pwsh
        working-directory: source
        run: |
          $expected = "${{ steps.request.outputs.version }}"
          $actual = (Select-String -Path "src\dungeon_helper\__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($actual -ne $expected) { throw "Source version $actual does not match requested $expected" }

      - name: Build and test Windows release
        shell: pwsh
        working-directory: source
        run: |
          .\scripts\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish to DH-releases
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:$env:GH_TOKEN@github.com/".insteadOf "https://github.com/"
          python scripts/publish_release.py publish --version "${{ steps.request.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
